<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梅田駅周辺 とんこつラーメン1000円以内ランダム | 9月版</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: linear-gradient(135deg, #f5e6d3 0%, #ffe8d6 50%, #fff5e6 100%);
    min-height: 100vh;
    color: #333;
    padding: 20px;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    font-weight: 900;
    color: #8B4513;
    margin-bottom: 8px;
    line-height: 1.3;
  }
  .badge {
    display: inline-block;
    background: #e74c3c;
    color: white;
    font-size: 0.85rem;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 20px;
  }
  .card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(139,69,19,0.15);
    padding: 28px;
    margin-bottom: 24px;
  }
  .result {
    text-align: center;
    min-height: 180px;
  }
  .shop-name {
    font-size: 1.5rem;
    font-weight: 900;
    color: #c0392b;
    margin: 12px 0 8px;
  }
  .menu-name {
    font-size: 1.3rem;
    font-weight: 700;
    color: #2c3e50;
    margin: 8px 0;
  }
  .price {
    font-size: 1.8rem;
    font-weight: 900;
    color: #27ae60;
  }
  .note {
    font-size: 0.85rem;
    color: #7f8c8d;
    margin-top: 8px;
  }
  button {
    display: block;
    width: 100%;
    max-width: 320px;
    margin: 20px auto;
    padding: 16px 24px;
    font-size: 1.15rem;
    font-weight: 700;
    background: linear-gradient(135deg, #e74c3c, #c0392b);
    color: white;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(231,76,60,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(231,76,60,0.5);
  }
  button:active { transform: translateY(0); }
  .info-section {
    margin-top: 24px;
  }
  .info-section h2 {
    font-size: 1.15rem;
    color: #8B4513;
    border-bottom: 3px solid #e74c3c;
    padding-bottom: 6px;
    margin-bottom: 12px;
  }
  .min-price {
    font-size: 1.4rem;
    font-weight: 900;
    color: #27ae60;
    text-align: center;
    margin: 12px 0;
  }
  .menu-list {
    list-style: none;
  }
  .menu-list li {
    padding: 10px 12px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.95rem;
  }
  .menu-list li:last-child { border-bottom: none; }
  .shop-tag {
    background: #fdebd0;
    color: #8B4513;
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 10px;
    margin-right: 8px;
  }
  .limited {
    background: #fadbd8;
    color: #c0392b;
    font-size: 0.7rem;
    padding: 1px 6px;
    border-radius: 8px;
    margin-left: 6px;
  }
  .prompt-box {
    background: #2c3e50;
    color: #ecf0f1;
    font-size: 0.75rem;
    padding: 16px;
    border-radius: 12px;
    margin-top: 32px;
    white-space: pre-wrap;
    line-height: 1.5;
    word-break: break-all;
  }
  .footer {
    text-align: center;
    font-size: 0.8rem;
    color: #95a5a6;
    margin-top: 20px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🍜 梅田駅周辺<br>とんこつラーメン1000円以内<br>ランダムピッカー</h1>
  <div style="text-align:center"><span class="badge">9月版</span></div>

  <div class="card">
    <div class="result" id="result">
      <p style="color:#7f8c8d; padding-top:40px;">下のボタンを押してランダムに選ぼう！</p>
    </div>
    <button onclick="pickRandom()">🎲 ランダムに選ぶ</button>
  </div>

  <div class="card info-section">
    <h2>💰 最低価格</h2>
    <div class="min-price" id="minPrice">計算中...</div>
  </div>

  <div class="card info-section">
    <h2>📋 選ばれるメニュー一覧（1000円以内）</h2>
    <ul class="menu-list" id="menuList"></ul>
  </div>

  <div class="prompt-box" id="promptBox"></div>

  <div class="footer">
    ※価格は2026年9月時点の参考値です。店舗により変動する場合があります。<br>
    期間限定メニューは予告なく終了することがあります。
  </div>
</div>

<script>
// 梅田駅周辺でこの料理（一風堂系とんこつラーメン）を1000円以内で食える場所・メニュー
const data = [
  {
    shop: "博多一風堂 梅田店",
    address: "大阪市北区角田町6-7 角田町ビル1F（東梅田徒歩3分）",
    menus: [
      { name: "白丸元味", price: 850, limited: false },
      { name: "赤丸新味", price: 920, limited: false },
      { name: "極からか麺", price: 960, limited: false },
      { name: "白丸チャーシュー麺", price: 950, limited: false }
    ]
  },
  {
    shop: "博多ラーメンげんこつ 梅田店",
    address: "阪急梅田駅近く",
    menus: [
      { name: "げんこつラーメン", price: 780, limited: false },
      { name: "こく旨ラーメン", price: 980, limited: false }
    ]
  },
  {
    shop: "博多一幸舎 エキマルシェ大阪店",
    address: "大阪駅構内（徒歩1分）",
    menus: [
      { name: "ラーメン", price: 800, limited: false },
      { name: "味玉ラーメン", price: 960, limited: false }
    ]
  },
  {
    shop: "源龍ラーメン 豊崎店",
    address: "中津駅徒歩5分（梅田から1駅）",
    menus: [
      { name: "豚骨ラーメン", price: 690, limited: false },
      { name: "背脂豚骨ラーメン", price: 690, limited: false }
    ]
  },
  {
    shop: "しぇからしか 梅田店",
    address: "東梅田駅徒歩1分",
    menus: [
      { name: "とんこつラーメン", price: 880, limited: false },
      { name: "チャーシュー麺", price: 980, limited: false }
    ]
  },
  {
    shop: "まんねん",
    address: "谷町線梅田駅徒歩3分",
    menus: [
      { name: "豚骨ラーメン", price: 780, limited: false },
      { name: "おすすめセット", price: 850, limited: false }
    ]
  },
  {
    shop: "博多一風堂 梅田店（期間限定）",
    address: "大阪市北区角田町6-7",
    menus: [
      { name: "油そば", price: 980, limited: true },  // 実際は少し高い場合あり、参考で調整
      { name: "辛油そば", price: 990, limited: true }
    ]
  }
];

// 全メニューをフラットに
const allMenus = [];
data.forEach(shop => {
  shop.menus.forEach(m => {
    if (m.price <= 1000) {
      allMenus.push({
        shop: shop.shop,
        address: shop.address,
        name: m.name,
        price: m.price,
        limited: m.limited
      });
    }
  });
});

// 最低価格を計算
const minPrice = Math.min(...allMenus.map(m => m.price));
document.getElementById('minPrice').textContent = minPrice + '円';

// メニュー一覧を表示
const listEl = document.getElementById('menuList');
allMenus
  .sort((a,b) => a.price - b.price)
  .forEach(m => {
    const li = document.createElement('li');
    li.innerHTML = `
      <div>
        <span class="shop-tag">${m.shop.replace('（期間限定）','')}</span>
        ${m.name}
        ${m.limited ? '<span class="limited">期間限定</span>' : ''}
      </div>
      <strong>${m.price}円</strong>
    `;
    listEl.appendChild(li);
  });

// ランダム選択
function pickRandom() {
  const item = allMenus[Math.floor(Math.random() * allMenus.length)];
  const resultEl = document.getElementById('result');
  resultEl.innerHTML = `
    <div class="shop-name">${item.shop}</div>
    <div class="note">${item.address}</div>
    <div class="menu-name">${item.name}${item.limited ? ' <span class="limited">期間限定</span>' : ''}</div>
    <div class="price">${item.price}円</div>
    <div class="note">※税込参考価格（店舗により変動あり）</div>
  `;
}

// プロンプトを下部に貼る
document.getElementById('promptBox').textContent = 
`梅田駅周辺でこの料理を1000円以内で食える場所をランダムにピックアップしてメニューもランダムに選ぶHTMLサイトを作ってください　最低値と選ばれるメニュー一覧も確認できるようにして
このプロンプト自体の文字をサイトの下部に貼って`;
</script>
</body>
</html>
