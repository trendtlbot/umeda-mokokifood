<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>十三駅周辺 1000円以内ラーメン・つけ麺 ランダムピックアップ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: linear-gradient(135deg, #f5f0e6 0%, #e8d9c0 100%);
    color: #333;
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    overflow: hidden;
  }
  header {
    background: #8B4513;
    color: white;
    padding: 24px;
    text-align: center;
  }
  header h1 {
    font-size: 1.6rem;
    margin-bottom: 8px;
  }
  header p {
    font-size: 0.95rem;
    opacity: 0.9;
  }
  .content {
    padding: 28px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: #d2691e;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 1.2rem;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s;
    margin-bottom: 24px;
  }
  .btn:hover {
    background: #b8860b;
  }
  .result {
    display: none;
    background: #fff8f0;
    border: 3px solid #d2691e;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
    animation: fadeIn 0.5s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result h2 {
    color: #8B4513;
    font-size: 1.5rem;
    margin-bottom: 12px;
  }
  .result .menu {
    font-size: 1.3rem;
    font-weight: bold;
    color: #d2691e;
    margin: 8px 0;
  }
  .result .price {
    font-size: 1.8rem;
    color: #c0392b;
    font-weight: bold;
  }
  .result .info {
    margin-top: 12px;
    font-size: 0.95rem;
    color: #555;
  }
  .section {
    margin-top: 32px;
  }
  .section h3 {
    color: #8B4513;
    border-bottom: 2px solid #d2691e;
    padding-bottom: 8px;
    margin-bottom: 16px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 10px 8px;
    text-align: left;
  }
  th {
    background: #f5e6d3;
    color: #8B4513;
  }
  tr:nth-child(even) {
    background: #faf6f0;
  }
  .lowest {
    background: #fff3cd;
    padding: 16px;
    border-radius: 8px;
    margin-bottom: 16px;
    border-left: 5px solid #ffc107;
  }
  footer {
    background: #333;
    color: #ccc;
    padding: 20px;
    font-size: 0.75rem;
    line-height: 1.6;
    word-break: break-all;
  }
  footer strong {
    color: #fff;
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🍜 十三駅周辺<br>1000円以内ラーメン・つけ麺</h1>
      <p>ランダムピックアップサイト</p>
    </header>

    <div class="content">
      <button class="btn" onclick="pickRandom()">🎲 ランダムに選ぶ！</button>

      <div id="result" class="result">
        <h2 id="shopName"></h2>
        <div class="menu" id="menuName"></div>
        <div class="price" id="menuPrice"></div>
        <div class="info" id="shopInfo"></div>
      </div>

      <div class="section">
        <h3>💰 最低値情報</h3>
        <div class="lowest" id="lowestInfo">
          現在のデータでの最低価格メニューは「楽園」の「金の牛かす塩らぁ麺」約680円前後です。<br>
          （価格は変動する可能性があるため、実際の店舗でご確認ください）
        </div>
      </div>

      <div class="section">
        <h3>📋 選ばれるメニュー一覧（1000円以内）</h3>
        <table>
          <thead>
            <tr>
              <th>店舗名</th>
              <th>メニュー</th>
              <th>価格目安</th>
              <th>アクセス</th>
            </tr>
          </thead>
          <tbody id="menuList">
          </tbody>
        </table>
      </div>
    </div>

    <footer>
      <strong>【このサイトのプロンプト】</strong><br>
      十三駅周辺でこの料理を1000円以内で食える場所をランダムにピックアップしてメニューもランダムに選ぶHTMLサイトを作ってください　最低値と選ばれるメニュー一覧も確認できるようにして<br>
      このプロンプト自体の文字をサイトの下部に貼って
    </footer>
  </div>

<script>
const data = [
  {
    shop: "ばっこ志",
    access: "十三駅東口 徒歩1分",
    menus: [
      { name: "とんこつら〜めん", price: 800 },
      { name: "黒油ラーメン", price: 750 },
      { name: "朱油ラーメン", price: 800 },
      { name: "特濃ラーメン", price: 900 },
      { name: "つけ麺", price: 850 }
    ]
  },
  {
    shop: "町田商店 十三店",
    access: "十三駅東口 徒歩1分",
    menus: [
      { name: "ラーメン（豚骨醤油）", price: 880 },
      { name: "塩ラーメン", price: 880 },
      { name: "つけ麺", price: 930 }
    ]
  },
  {
    shop: "三豊麺 十三店",
    access: "十三駅西口 徒歩1分",
    menus: [
      { name: "白博多ラーメン", price: 890 },
      { name: "黒博多ラーメン", price: 950 },
      { name: "濃厚魚介つけ麺", price: 990 },
      { name: "赤博多ラーメン", price: 990 }
    ]
  },
  {
    shop: "楽園",
    access: "十三駅 徒歩2〜3分",
    menus: [
      { name: "金の牛かす塩らぁ麺", price: 680 },
      { name: "スタミナ牛かす塩らぁ麺", price: 730 },
      { name: "煮卵牛かす塩らぁ麺", price: 780 },
      { name: "レアチャーシュー牛かす塩らぁ麺", price: 980 }
    ]
  },
  {
    shop: "ラーメン豚山 十三東口店",
    access: "十三駅東口 徒歩1分",
    menus: [
      { name: "ミニラーメン（麺125g・豚2枚）", price: 950 }
    ]
  },
  {
    shop: "中華そば 桐麺 総本店",
    access: "十三駅 徒歩2分",
    menus: [
      { name: "あっさり醤油ラーメン", price: 880 },
      { name: "こってり醤油ラーメン", price: 950 },
      { name: "まぜ麺Z", price: 950 }
    ]
  },
  {
    shop: "九州らーめん 亀王 十三駅前店",
    access: "十三駅 徒歩1分",
    menus: [
      { name: "黒味噌ラーメン", price: 850 },
      { name: "とんこつラーメン", price: 800 }
    ]
  }
];

// 全メニューをフラット化
const allMenus = [];
data.forEach(shop => {
  shop.menus.forEach(menu => {
    allMenus.push({
      shop: shop.shop,
      access: shop.access,
      name: menu.name,
      price: menu.price
    });
  });
});

// メニュー一覧を表示
const tbody = document.getElementById('menuList');
allMenus
  .sort((a, b) => a.price - b.price)
  .forEach(item => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item.shop}</td>
      <td>${item.name}</td>
      <td>${item.price}円</td>
      <td>${item.access}</td>
    `;
    tbody.appendChild(tr);
  });

// 最低値を計算
const lowest = allMenus.reduce((min, m) => m.price < min.price ? m : min, allMenus[0]);
document.getElementById('lowestInfo').innerHTML = `
  現在のデータでの<strong>最低価格</strong>は<br>
  <strong>${lowest.shop}</strong> の 「${lowest.name}」 <span style="color:#c0392b;font-size:1.3rem;">${lowest.price}円</span> です。<br>
  <small>※価格は変動する可能性があるため、実際の店舗でご確認ください。2024〜2026年時点の情報を基にしています。</small>
`;

function pickRandom() {
  const item = allMenus[Math.floor(Math.random() * allMenus.length)];
  document.getElementById('shopName').textContent = item.shop;
  document.getElementById('menuName').textContent = item.name;
  document.getElementById('menuPrice').textContent = item.price + '円';
  document.getElementById('shopInfo').textContent = 'アクセス: ' + item.access + '　｜　十三駅周辺で1000円以内のラーメン・つけ麺';
  document.getElementById('result').style.display = 'block';
}
</script>
</body>
</html>
